sonar.projectKey=Kaaponen_a11y-python-monitor
sonar.organization=kaaponen
sonar.projectName=A11y Python Monitor
sonar.projectVersion=1.0.0

# Paths
sonar.sources=src/
sonar.tests=tests/
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/.venv/**,**/venv/**

# Python specific
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-results.xml

# Quality gate
sonar.qualitygate.wait=true

# Analysis parameters
sonar.scm.provider=git